
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hearo – Live Captions + Tone</title>
  <script defer src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hearo</h1>

  <div id="controls">
    <label for="language">Speak in:</label>
    <select id="language">
      <option value="en-US">English</option>
      <option value="es-ES">Spanish</option>
      <option value="fr-FR">French</option>
      <option value="de-DE">German</option>
      <option value="ja-JP">Japanese</option>
      <option value="zh-CN">Chinese</option>
    </select>

    <button id="toggleTranslate" style="margin-left: 20px;">Enable Translation</button>

    <select id="translateTo" style="margin-left: 10px; display: none;">
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
      <option value="zh">Chinese</option>
      <option value="ar">Arabic</option>
      <option value="hi">Hindi</option>
      <option value="ko">Korean</option>
      <option value="pt">Portuguese</option>
      <option value="ru">Russian</option>
    </select>
  </div>

  <div id="captions">Click anywhere to start…</div>
  <div id="translation" style="display: none;"></div>
  <div id="tone">Tone: —</div>
</body>
</html>
